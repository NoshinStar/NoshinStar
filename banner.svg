<svg width="1280" height="300" viewBox="0 0 1280 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e2b5e"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="300" fill="url(#bgGrad)"/>
  <rect width="1280" height="300" fill="url(#glow)"/>

  <!-- subtle dot grid -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="60" cy="40" r="2"/><circle cx="110" cy="40" r="2"/><circle cx="160" cy="40" r="2"/>
    <circle cx="60" cy="80" r="2"/><circle cx="110" cy="80" r="2"/><circle cx="160" cy="80" r="2"/>
    <circle cx="60" cy="120" r="2"/><circle cx="110" cy="120" r="2"/><circle cx="160" cy="120" r="2"/>
    <circle cx="1120" cy="220" r="2"/><circle cx="1170" cy="220" r="2"/><circle cx="1220" cy="220" r="2"/>
    <circle cx="1120" cy="260" r="2"/><circle cx="1170" cy="260" r="2"/><circle cx="1220" cy="260" r="2"/>
  </g>

  <!-- code bracket motif, right side -->
  <text x="1060" y="205" font-family="Consolas, Menlo, monospace" font-size="150" fill="#38bdf8" opacity="0.15">&lt;/&gt;</text>

  <!-- accent line -->
  <rect x="90" y="118" width="70" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- name -->
  <text x="90" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#f8fafc">
    Noshin Nawar
  </text>

  <!-- tagline -->
  <text x="90" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">
    CSE Student
    <tspan fill="#64748b"> · </tspan>Aspiring Software Engineer
  </text>
  <text x="90" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">
    MERN Stack Learner
    <tspan fill="#64748b"> · </tspan>AI/ML &amp; Research Enthusiast
  </text>

  <!-- small badge row -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#93c5fd">
    <rect x="90" y="222" width="94" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
    <text x="112" y="242">JavaScript</text>

    <rect x="196" y="222" width="66" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
    <text x="216" y="242">React</text>

    <rect x="274" y="222" width="90" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
    <text x="292" y="242">Node.js</text>

    <rect x="376" y="222" width="76" height="30" rx="15" fill="#1e293b" stroke="#a78bfa" stroke-width="1" opacity="0.8"/>
    <text x="396" y="242" fill="#c4b5fd">AI / ML</text>
  </g>
</svg>
